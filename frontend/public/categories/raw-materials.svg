    <path d="M16,44 C16,94 164,94 164,44 Z" fill="#FFFFFF" fill-opacity="0.72" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="90" cy="44" rx="74" ry="22" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <!-- Granules -->
    <g fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8">
      <circle cx="52" cy="42" r="7"/><circle cx="68" cy="38" r="7"/><circle cx="85" cy="36" r="7.5"/>
      <circle cx="102" cy="37" r="7"/><circle cx="118" cy="41" r="7"/><circle cx="132" cy="46" r="6.5"/>
      <circle cx="62" cy="48" r="7"/><circle cx="78" cy="46" r="7.5"/><circle cx="95" cy="47" r="7"/>
      <circle cx="112" cy="48" r="7"/><circle cx="88" cy="54" r="6.5"/><circle cx="72" cy="53" r="6.5"/>
    </g>
    <g fill="#38BDF8" opacity="0.85">
      <circle cx="74" cy="41" r="5"/><circle cx="96" cy="41" r="5.5"/><circle cx="110" cy="44" r="4.8"/><circle cx="82" cy="50" r="5"/>
    </g>
