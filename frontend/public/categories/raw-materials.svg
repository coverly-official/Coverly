<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#E3ECFF"/>
    </radialGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="coil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- Floor shadow -->
  <ellipse cx="320" cy="332" rx="220" ry="22" fill="#94A3B8" opacity="0.26"/>
  <!-- Brushed Steel Coil (Back Left) -->
  <g transform="translate(155,115)">
    <ellipse cx="75" cy="95" rx="68" ry="86" fill="#64748B"/>
    <ellipse cx="62" cy="95" rx="68" ry="86" fill="url(#coil)" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="62" cy="95" rx="44" ry="56" fill="none" stroke="#94A3B8" stroke-width="2" opacity="0.6"/>
    <ellipse cx="62" cy="95" rx="22" ry="28" fill="#334155"/>
    <path d="M62,181 L138,181 L156,162 L75,162 Z" fill="url(#steel)"/>
  </g>
  <!-- Copper Ingots Stack (Back Right) -->
  <g transform="translate(330,155)">
    <polygon points="20,120 140,120 165,92 45,92" fill="url(#copper)" stroke="#7C2D12" stroke-width="1.5"/>
    <polygon points="20,120 140,120 132,148 12,148" fill="#9A3412"/>
    <polygon points="45,86 155,86 178,60 68,60" fill="url(#copper)" stroke="#7C2D12" stroke-width="1.5"/>
    <polygon points="45,86 155,86 147,112 37,112" fill="#B45309"/>
  </g>
  <!-- Glass Bowl of Polymer Granules (Front Center) -->
  <g transform="translate(230,220)">
